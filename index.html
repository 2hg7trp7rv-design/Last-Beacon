<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LAST BEACON — 最後の灯火</title>
  </head>
  <body>
    <div id="app">
      <main class="game-shell" aria-label="LAST BEACON ゲーム画面">
        <div class="world-wrap">
          <div id="game" aria-hidden="true"></div>
          <div class="fog-layer" aria-hidden="true"></div>
          <div class="world-ui">
            <button id="scrap-action" class="hotspot hotspot--scrap" type="button" aria-label="廃材を回収する">
              <span class="hotspot__pulse" aria-hidden="true"></span>
              <span class="hotspot__arrow" aria-hidden="true">↓</span>
              <span class="hotspot__label">廃材をタップ</span>
            </button>
            <button id="upgrade-action" class="hotspot hotspot--upgrade" type="button" aria-label="灯火を強化する">
              <span class="upgrade-arrow" aria-hidden="true">↑</span>
              <span class="upgrade-cost"><span aria-hidden="true">⚙</span> <b id="upgrade-current">12</b>/20</span>
            </button>
            <button id="rescue-action" class="hotspot hotspot--rescue" type="button" aria-label="生存者を救助する">
              <span class="hotspot__pulse" aria-hidden="true"></span>
              <span class="hotspot__arrow" aria-hidden="true">↓</span>
              <span class="hotspot__label">救助する</span>
            </button>
          </div>
        </div>

        <header class="hud" aria-label="所持資源">
          <div class="resource resource--power">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 2 5 13h6l-1 9 8.5-12h-6.1z"/></svg>
            <span id="power-value" data-testid="resource-power">80</span>
          </div>
          <div class="resource resource--scrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 13a8.7 8.7 0 0 0 0-2l2-1.5-2-3.5-2.5 1a8 8 0 0 0-1.7-1L16 3h-4l-.5 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a8.7 8.7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.5 3h4l.5-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5zM14.8 12a2.8 2.8 0 1 1-5.6 0 2.8 2.8 0 0 1 5.6 0"/></svg>
            <span id="scrap-value" data-testid="resource-scrap">12</span>
          </div>
          <div class="resource resource--food">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 3.4C13.5 3.2 8.8 5.6 7 10.2c-1 2.8-.2 5.2.8 6.8-1 1.2-1.8 2.5-2.4 4h2.3c.5-1 1-1.8 1.6-2.6 2.2 1 5.3.8 7.5-1.5 3.8-4 3.9-9.5 3.9-13.5M10.5 16c1.6-3.5 4.2-6 7.4-8-2.7 2.8-4.7 5.8-6 8.8z"/></svg>
            <span id="food-value" data-testid="resource-food">8</span>
          </div>
          <div class="resource resource--people">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0 2c-5.2 0-9 2.5-9 6v2h18v-2c0-3.5-3.8-6-9-6"/></svg>
            <span id="people-value" data-testid="resource-population">2/4</span>
          </div>
        </header>

        <section class="objective" aria-live="polite">
          <span id="objective-kicker">最初の一手</span>
          <strong id="objective-title" data-testid="objective">光っている廃材をタップ</strong>
        </section>

        <button id="sound-toggle" class="sound-toggle" type="button" aria-label="効果音をオフにする" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm11.5.2v5.6a4 4 0 0 0 0-5.6m0-4v2.1a7 7 0 0 1 0 9.4v2.1a9 9 0 0 0 0-13.6"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16-1.4 1.4-3.2-3.2c-.6.4-1.2.7-1.9 1v-2.1l-1-.9V19l-5-4H4V9h2.2L2.6 5.4zm8.5 1v5.7L9 7.2zM17 9.2v3.5l2.1 2.1a7 7 0 0 0-3.6-7.5v2a4 4 0 0 1 1.5 0"/></svg>
        </button>

        <nav class="bottom-nav" aria-label="ゲームメニュー">
          <button id="nav-build" type="button" data-panel="build">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 6.3 3-3a5 5 0 0 0-6.4 6.4L3 18v3h3l8.3-8.3a5 5 0 0 0 6.4-6.4l-3 3-3-3z"/></svg>
            <span>施設</span>
          </button>
          <button id="nav-workers" type="button" data-panel="workers">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0 2c-5.2 0-9 2.5-9 6v2h18v-2c0-3.5-3.8-6-9-6"/></svg>
            <span>住民</span>
          </button>
          <button id="nav-map" type="button" data-panel="map">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3zm6-.8v12.6l6 3V7.2z"/></svg>
            <span>周辺</span>
          </button>
        </nav>

        <section id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title">
          <button id="drawer-close" class="drawer__close" type="button" aria-label="閉じる">×</button>
          <p id="drawer-kicker" class="drawer__kicker">BASE STATUS</p>
          <h2 id="drawer-title">施設</h2>
          <div id="drawer-content"></div>
        </section>
        <button id="drawer-backdrop" class="drawer-backdrop" type="button" hidden aria-label="メニューを閉じる"></button>

        <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
        <button id="update-app" class="update-app" type="button" hidden>更新版を読み込む</button>
        <div class="rotate-notice" role="status">縦向きでプレイしてください</div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
